# ══════════════════════════════════════════════════════════════════════════════
# MarketNow — Docker MCP Registry entry (version: 1.15.0)
# ══════════════════════════════════════════════════════════════════════════════
# SUBMITTED 2026-09-27 as docker/mcp-registry PR #5263:
#   https://github.com/docker/mcp-registry/pull/5263
#   Location: servers/marketnow-mcp/server.yaml
#   (the registry retired the old catalog/<category>/ layout — entries are
#   now servers/<name>/server.yaml, type: server for local docker images)
# Once merged, every Docker Desktop user gets MarketNow via:
#   docker mcp gateway catalog install marketnow-mcp
# Until then (and after), the direct commands already work — the image is
# PUBLIC (anonymous pull verified 2026-09-27):
#   docker mcp gateway add --docker ghcr.io/alicelabs-llc/marketnow-mcp
#   docker run -i --rm ghcr.io/alicelabs-llc/marketnow-mcp
# ══════════════════════════════════════════════════════════════════════════════

name: marketnow-mcp
image: ghcr.io/alicelabs-llc/marketnow-mcp
type: server
meta:
  category: security
  tags:
    - security
    - mcp
    - trust-verification
    - ai-agents
    - marketplace
about:
  title: MarketNow
  description: MCP marketplace and trust layer — search 9,300+ security-audited skills, verify Agent Trust Cards (fail-closed ATC/1.0, Ed25519 + RFC 8785 JCS), check revocation status, and fingerprint tool definitions against tool poisoning. 13 tools, no API key required.
  icon: https://www.google.com/s2/favicons?domain=marketnow.site&sz=64
source:
  project: https://github.com/alicelabs-llc/MARKETNOW
  commit: 222842c063c6578ddc4e186edc254f0757be9c95
run:
  allowHosts:
    - marketnow.site:443
    - www.marketnow.site:443

# Least-privilege runtime posture (matches docker-compose.yml in the repo):
#   user 1000:1000, readOnlyRootFilesystem, capDrop ALL, noNewPrivileges.
# The server reads marketplace data from https://www.marketnow.site/api/* on
# first tool call (startup is offline-safe); ATC trust verification is fully
# self-contained node:crypto + Ed25519 — no network in trust decisions.
